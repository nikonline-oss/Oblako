{% extends 'base.html' %}
{% block title %}Редактировать организацию{% endblock %}

{% block content %}
<h4>Редактировать организацию</h4>
<form method="post">
  {% csrf_token %}
  <div class="input-field">{{ form.name }}<label class="active" for="{{ form.name.id_for_label }}">Название</label></div>
  <div class="input-field">{{ form.address }}<label class="active" for="{{ form.address.id_for_label }}">Адрес</label></div>
  <div class="input-field">{{ form.account }}<label class="active" for="{{ form.account.id_for_label }}">Счёт</label></div>
  <div class="input-field">{{ form.chief }}<label class="active" for="{{ form.chief.id_for_label }}">Руководитель</label></div>
  <div class="input-field">{{ form.financial_chief }}<label class="active" for="{{ form.financial_chief.id_for_label }}">Главный бухгалтер</label></div>
  <button class="btn blue">Сохранить</button>
</form>
{% endblock %}
