{% extends 'base.html' %}
{% block title %}Добавить отдел{% endblock %}

{% block content %}
<h4>Добавить отдел</h4>
<form method="post">
  {% csrf_token %}
  <div class="input-field">
    {{ form.name }}
    <label for="{{ form.name.id_for_label }}">Название</label>
  </div>
  <button type="submit" class="btn blue">
    <i class="material-icons left">save</i>Сохранить
  </button>
</form>
{% endblock %}
