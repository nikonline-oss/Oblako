{% extends 'base.html' %}
{% block title %}Удалить сотрудника{% endblock %}

{% block content %}
<h4>Удалить сотрудника?</h4>
<form method="post">
  {% csrf_token %}
  <p>Вы уверены, что хотите удалить "{{ object.last_name }} {{ object.first_name }} {{ object.middle_name }}"?</p>
  <button class="btn red">Удалить</button>
  <a href="{% url 'employees:list' %}" class="btn grey">Отмена</a>
</form>
{% endblock %}
