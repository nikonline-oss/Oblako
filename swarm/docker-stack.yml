# Стек для Docker Swarm: 1 узел БД (role=db) + веб-узлы (role=web)
x-db-env: &db-env
  POSTGRES_DB: crm
  POSTGRES_USER: crm
  POSTGRES_PASSWORD: crm_password
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

x-web-env: &web-env
  <<: *db-env
  DJANGO_SECRET_KEY: swarm-lab-secret
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "*"

services:
  db:
    image: postgres:17-alpine
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == db

  # Одноразовая задача: миграции + перенос данных из SQLite
  migrate:
    image: ${WEB_IMAGE:-registry:5000/crm-web:latest}
    command: sh -c "python manage.py migrate --noinput && python manage.py loaddata docker/sqlite_dump.json"
    environment: *web-env
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.role == web

  web:
    image: ${WEB_IMAGE:-registry:5000/crm-web:latest}
    environment:
      <<: *web-env
      RUN_MIGRATIONS: "0"
    ports:
      - "${WEB_PORT:-80}:8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/nariad/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.labels.role == web
        max_replicas_per_node: 2
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 5s

volumes:
  pgdata:

networks:
  backend:
    driver: overlay
