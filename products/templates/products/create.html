{% extends 'base.html' %}
{% block title %}Добавить товар{% endblock %}

{% block content %}
<h4>Добавить товар</h4>
<form method="post">
  {% csrf_token %}
  <div class="input-field">{{ form.name }}<label for="{{ form.name.id_for_label }}">Название</label></div>
  <div class="input-field">{{ form.price }}<label for="{{ form.price.id_for_label }}">Цена</label></div>
  <div class="input-field">{{ form.unit }}<label>Единица измерения</label></div>
  <button class="btn green">Добавить</button>
</form>
{% endblock %}
