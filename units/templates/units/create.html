{% extends 'base.html' %}
{% block title %}Добавить единицу измерения{% endblock %}

{% block content %}
<h4>Добавить единицу измерения</h4>
<form method="post">
  {% csrf_token %}
  <div class="input-field">
    {{ form.name }}
    <label for="{{ form.name.id_for_label }}">Название</label>
  </div>
  <button class="btn green">Добавить</button>
</form>
{% endblock %}
