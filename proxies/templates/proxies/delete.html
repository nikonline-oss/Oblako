{% extends 'base.html' %}
{% block title %}Удаление доверенности #{{ object.id }}{% endblock %}

{% block content %}
<h4>Удалить доверенность #{{ object.id }}?</h4>
<form method="post">
  {% csrf_token %}
  <p>Вы уверены, что хотите удалить эту доверенность?</p>
  <button class="btn red">Удалить</button>
  <a href="{% url 'proxies:list' %}" class="btn grey">Отмена</a>
</form>
{% endblock %}
