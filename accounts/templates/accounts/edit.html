<!-- accounts/templates/accounts/edit.html -->
{% extends 'base.html' %}
{% block title %}Редактировать счёт{% endblock %}

{% block content %}
<h4>Редактировать счёт</h4>
<form method="post">
  {% csrf_token %}
  <div class="input-field">
    {{ form.account }}
    <label class="active" for="{{ form.account.id_for_label }}">Номер счёта</label>
  </div>
  <div class="input-field">
    {{ form.bank_name }}
    <label class="active" for="{{ form.bank_name.id_for_label }}">Банк</label>
  </div>
  <div class="input-field">
    {{ form.bank_identity_number }}
    <label class="active" for="{{ form.bank_identity_number.id_for_label }}">БИК</label>
  </div>
  <button class="btn blue">Сохранить</button>
</form>
{% endblock %}
