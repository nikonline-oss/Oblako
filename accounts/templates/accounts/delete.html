<!-- accounts/templates/accounts/delete.html -->
{% extends 'base.html' %}
{% block title %}Удалить счёт{% endblock %}

{% block content %}
<h4>Удалить счёт?</h4>
<form method="post">
  {% csrf_token %}
  <p>Вы уверены, что хотите удалить счёт {{ object.account }}?</p>
  <button class="btn red">Удалить</button>
  <a href="{% url 'accounts:list' %}" class="btn grey">Отмена</a>
</form>
{% endblock %}
