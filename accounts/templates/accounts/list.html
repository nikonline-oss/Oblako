{% extends 'base.html' %}
{% block title %}Счета{% endblock %}

{% block content %}
<h4>Счета</h4>
<div class='right-align' style='margin-bottom: 20px;'>
  <a href='{% url "accounts:create" %}' class='btn blue'><i class='material-icons left'>add</i>Добавить</a>
</div>

<table class='highlight'>
  <thead>
    <tr><th>ID</th><th>Номер счёта</th><th>Банк</th><th>БИК</th><th>Действия</th></tr>
  </thead>
  <tbody>
    {% for account in accounts %}
    <tr>
      <td>{{ account.id }}</td>
      <td>{{ account.account }}</td>
      <td>{{ account.bank_name }}</td>
      <td>{{ account.bank_identity_number }}</td>
      <td>
        <a href='{% url "accounts:edit" account.pk %}' class='btn-small orange'><i class='material-icons'>edit</i></a>
        <a href='{% url "accounts:delete" account.pk %}' class='btn-small red' onclick='return confirm("Удалить?");'>
          <i class='material-icons'>delete</i>
        </a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
