# ЛР7: WordPress + MySQL + phpMyAdmin (аналог Open Server Panel / Denwer из методички).
# Порты, адрес сайта и пароли — в .env (см. .env.example). Запуск и наполнение: ./setup.sh
x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wptest}
  WORDPRESS_DB_USER: ${MYSQL_USER:-wp}
  WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
  # Адрес сайта задаётся снаружи, поэтому сайт работает на любом порту/сервере
  WP_URL: ${WP_URL:-http://localhost:8081}
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', getenv_docker('WP_URL', 'http://localhost:8081'));
    define('WP_SITEURL', getenv_docker('WP_URL', 'http://localhost:8081'));

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wptest}
      MYSQL_USER: ${MYSQL_USER:-wp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    environment: *db-env
    ports:
      - "${WP_BIND:-0.0.0.0}:${WP_PORT:-8081}:80"
    volumes:
      - wpdata:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php"]
      interval: 3s
      timeout: 3s
      retries: 40

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "${PMA_BIND:-127.0.0.1}:${PMA_PORT:-8082}:80"
    depends_on:
      db:
        condition: service_healthy

  # WP-CLI для установки и наполнения сайта: docker compose run --rm cli wp ...
  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"   # www-data образа wordpress — владелец файлов сайта
    environment:
      <<: *db-env
      HOME: /tmp
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      WP_TITLE: ${WP_TITLE:-Сайт студента}
      MAP_LL: ${MAP_LL:-37.617635,55.755814}
    volumes:
      - wpdata:/var/www/html
      - ./setup:/setup:ro
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  dbdata:
  wpdata:
